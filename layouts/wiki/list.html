{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<h1>{{ .Title }}</h1>
<div>
    <ul class="list-none divide-y divide-dark/20 p-0">
        {{ range .RegularPages }}
        <li class="py-2">
            <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
