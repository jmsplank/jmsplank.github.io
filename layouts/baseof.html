<!doctype html>
<html
  lang="{{ or site.Language.Locale site.Language.Lang }}"
  dir="{{ or site.Language.Direction `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>

  <body>
    <div class="mx-auto max-w-4xl px-4">
      {{ partial "header.html" . }}
      <main>{{ block "main" . }}{{ end }}</main>
      <footer class="pt-12">
        <hr />
        {{ partial "footer.html" . }}
      </footer>
    </div>
  </body>
</html>
