<!doctype html>
<html
  lang="{{ or site.Language.Locale site.Language.Lang }}"
  dir="{{ or site.Language.Direction `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
  </head>

  <body class="pt-4">
    <div class="mx-auto h-full max-w-8xl px-4">
      <main class="flex justify-center">{{ block "main" . }}{{ end }}</main>
      <footer class="pt-12 print:hidden">
        <hr />
        {{ partial "footer.html" .}}
      </footer>
    </div>
  </body>
</html>
