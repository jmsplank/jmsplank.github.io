baseURL = 'https://jamesplank.co.uk/'
locale = 'en-GB'
title = 'James Plank'
sectionPagesMenu = 'main'

[params]
author = 'James Plank'

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[security.exec]
# Only what the build needs (setting this replaces Hugo's default list): the Tailwind CLI and the node it runs on
allow = ['^node$', '^tailwindcss$']

[build.buildStats]
enable = true
[[build.cachebusters]]
source = "assets/notwatching/hugo_stats\\.json"
target = "css"
[[module.mounts]]
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"
[[module.mounts]]
source = "assets"
target = "assets"
